<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialNet Manager</title>

  <!-- Google Fonts -->   <link rel="preconnect" href="https://fonts.googleapis.com" />   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />   <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />    <!-- Bootstrap 5.3 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

  <!-- Custom styles (must come AFTER Bootstrap CDN) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase JS client via CDN (must load before app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ===== APPLICATION TITLE HEADER ===== -->
  <header id="app-header">
    
    <h1 id="app-title">SocialNet Manager</h1>

    </div>
  </header>

<!-- Main content: three equal panels -->
<div id="app-wrapper">
  <main class="container-fluid flex-grow-1 py-2">
    <div class="row g-2 h-100">

      <!-- ===== LEFT PANEL: Profile Management ===== -->
      <div class="col-12 col-md-4">
        <div class="sn-panel">
          <h6 class="fw-bold text-dark border-bottom pb-1 mb-2">Profile Management</h6>

          <!-- Add/Lookup Profile -->
          <label for="input-name" class="form-label fw-semibold small mb-1">Search or Add Profile:</label>
          <input type="text" id="input-name" class="form-control form-control-sm mb-1"
                 placeholder="Type name to search or add...">
          <div class="d-flex gap-1 mb-2">
            <button id="btn-clear-search" class="btn btn-secondary btn-sm flex-fill">Clear</button>
            <button id="btn-add" class="btn btn-primary btn-sm flex-fill">Add</button>
            <button id="btn-delete" class="btn btn-danger btn-sm flex-fill">Delete</button>
          </div>

          <!-- Profile List -->
          <p class="small fw-semibold text-muted mb-1">All Profiles:</p>
          <div id="profile-list" class="profile-list-box border rounded p-1 flex-grow-1">
            <!-- Populated dynamically by JavaScript -->
          </div>
        </div>
      </div>

      <!-- ===== CENTER PANEL: Profile Information ===== -->
      <div class="col-12 col-md-4">
        <div class="sn-panel text-center">
          <h6 class="fw-bold text-dark border-bottom pb-1 mb-2">Profile Information</h6>

          <!-- Profile picture and name -->
          <div class="d-flex flex-column align-items-center mb-2">
            <img id="profile-pic"
                 src="resources/images/default.png"
                 alt="Profile picture"
                 class="profile-thumb rounded-circle border mb-2" />
            <h5 id="profile-name" class="fw-bold mb-0">No Profile Selected</h5>
          </div>

          <!-- Current Status -->
          <div class="mb-2 text-start">
            <label class="form-label fw-semibold small mb-1">Current Status:</label>
            <div id="profile-status" class="border rounded p-1 bg-white small">&mdash;</div>
          </div>

          <!-- Favorite quote -->
          <div class="mb-2 text-start">
            <label class="form-label fw-semibold small mb-1">Favorite Quote:</label>
            <div id="profile-quote" class="border rounded p-1 bg-white small">&mdash;</div>
          </div>

          <!-- Friends list -->
          <div class="text-start flex-grow-1 d-flex flex-column" style="min-height: 0;">
            <label class="form-label fw-semibold small mb-1">Friends:</label>
            <div id="friends-list" class="border rounded p-1 bg-white flex-grow-1">
              <!-- Populated dynamically by JavaScript -->
            </div>
          </div>
        </div>
      </div>

      <!-- ===== RIGHT PANEL: Edit Profile ===== -->
      <div class="col-12 col-md-4">
        <div class="sn-panel sn-panel-edit">
          <h6 class="fw-bold text-dark border-bottom pb-1 mb-2">Edit Profile</h6>

          <div class="flex-grow-1 overflow-auto pe-1 mb-2">
            <!-- Change Status -->
            <label class="form-label fw-semibold small mb-1">Change Status:</label>
            <input type="text" id="input-status" class="form-control form-control-sm mb-1"
                   placeholder="Enter new status">
            <button id="btn-status" class="btn btn-primary btn-sm w-100 mb-2">Update Status</button>

            <!-- Change Favorite Quote -->
            <label class="form-label fw-semibold small mb-1">Change Favorite Quote:</label>
            <input type="text" id="input-quote" class="form-control form-control-sm mb-1"
                   placeholder="Enter favorite quote">
            <button id="btn-quote" class="btn btn-primary btn-sm w-100 mb-2">Update Quote</button>

            <!-- Change Picture -->
            <label class="form-label fw-semibold small mb-1">Change Picture:</label>
            
            <!-- Upload from device -->
            <div class="mb-1">
              <label class="form-label fw-semibold mb-1 text-muted" style="font-size: 0.8rem;">Upload from device:</label>
              <input type="file" id="file-picture" class="form-control form-control-sm mb-1"
                     accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
            </div>
            
            <!-- Paste image URL -->
            <div class="mb-2">
              <label class="form-label fw-semibold mb-1 text-muted" style="font-size: 0.8rem;">Or paste an image URL:</label>
              <input type="text" id="input-picture-url" class="form-control form-control-sm mb-1"
                     placeholder="https://example.com/image.webp">
            </div>
            <button id="btn-update-picture" class="btn btn-primary btn-sm w-100 mb-2">Update Picture</button>

            <!-- Manage Friends -->
            <label class="form-label fw-semibold small mb-1">Manage Friends:</label>
            <input type="text" id="input-friend" class="form-control form-control-sm mb-1"
                   placeholder="Enter friend's name">
            <div class="d-flex gap-1 mb-1">
              <button id="btn-add-friend" class="btn btn-success btn-sm flex-fill">Add Friend</button>
              <button id="btn-remove-friend" class="btn btn-warning btn-sm flex-fill">Remove</button>
            </div>
          </div>

          <!-- Exit Button -->
          <button id="btn-exit" class="btn btn-secondary btn-sm w-100 mt-auto">Exit</button>

        </div>
      </div>

    </div><!-- /.row -->
  </main>

  <!-- STATUS BAR: always at the bottom of the page -->
  <footer id="status-bar">
    <span id="status-message">Ready. Select a profile from the list.</span>
  </footer>

</div><!-- /#app-wrapper -->

  <!-- Bootstrap JS bundle via CDN (Popper.js included) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <!-- Application logic (must come AFTER Bootstrap JS and Supabase CDN) -->
  <script src="js/app.js"></script>
</body>
</html>
